<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notatniczek</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">

  <div class="container">
    <h2 class="mb-4">Notatniczek</h2>

    <!-- Pasek z zakładkami -->
    <ul class="nav nav-tabs" id="myTab">
      <li class="nav-item">
        <button class="nav-link active" id="akordeon-notatek-tab" data-bs-toggle="tab" data-bs-target="#notatki-akordeon"
          type="button">
          Notatki - akordeon
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="kasowanie-tab" data-bs-toggle="tab" data-bs-target="#kasowanie"
          type="button">
          Kasowanie notatek
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="eksport-tab" data-bs-toggle="tab" data-bs-target="#eksport"
          type="button">
          Eksport notatek
        </button>
      </li>
    </ul>

    <!-- Zawartość zakładek -->
    <div class="tab-content border border-top-0 p-4 bg-light rounded-bottom" id="myTabContent">
      <div class="tab-pane fade show active" id="notatki-akordeon">
        <div class="accordion" id="accordionExample">
            <!-- Ten accordion-item i tak zoztenie usunięty... -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                    Sekcja 1
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                    To jest zawartość sekcji pierwszej.
                    </div>
                </div>
            </div>
        </div>
      </div>
      <div class="tab-pane fade" id="kasowanie">
        <h4>Kasowanie</h4>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#optionsModal">
          Wyczyść wszystkie notatki
        </button>

        <!-- Modal -->
        <div class="modal fade" id="optionsModal" tabindex="-1" aria-labelledby="optionsModalLabel" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="optionsModalLabel">Wybierz opcję</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
              </div>
              <div class="modal-body">
                Czy naprawdę chcesz posprzątać zupełnie?
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Nie</button>
                <button type="button" class="btn btn-success" onclick="kasowanie();">Tak</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="tab-pane fade" id="eksport">
        <h4>Eksport</h4>
        <p>Tutaj będzie eksport</p>
      </div>
    </div>
  </div>
  <script>
  function kasowanie() {
    alert("Funkcja kasowanie() została uruchomiona!");
    
  }
  // 1. Pobierz notatki z API
  fetch("http://localhost/api1/api.php")
    .then(res => res.json())
    .then(data => {
      const accordion = document.getElementById("accordionExample");
      accordion.innerHTML = "";

      data.forEach((note, index) => {
        const isFirst = index === 0 ? "show" : "";
        const collapseId = `collapse${note.id}`;
        const headerId = `heading${note.id}`;
        const textareaId = `textarea${note.id}`;

        accordion.innerHTML += `
          <div class="accordion-item">
            <h2 class="accordion-header" id="${headerId}">
              <button class="accordion-button ${isFirst ? "" : "collapsed"}"
                      type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#${collapseId}">
                Notatka ${note.id}
              </button>
            </h2>
            <div id="${collapseId}"
                 class="accordion-collapse collapse ${isFirst}"
                 data-bs-parent="#accordionExample">
              <div class="accordion-body">
                <textarea id="${textareaId}" class="form-control" rows="4">${note.content || ""}</textarea>
              </div>
            </div>
          </div>
        `;
      });

      // 2. Obsłuż zdarzenie zwijania (collapse.bs.collapse)
      const collapses = accordion.querySelectorAll(".accordion-collapse");
      collapses.forEach(collapse => {
        collapse.addEventListener("hide.bs.collapse", () => {
          const noteId = collapse.id.replace("collapse", ""); // np. "5"
          const textarea = document.getElementById(`textarea${noteId}`);
          const newContent = textarea.value;


          fetch(`http://localhost/api1/api.php?id=${noteId}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ content: newContent })
          })
          .then(res => res.json())
          .then(resp => {
            console.log("Zapisano:", resp);
          })
          .catch(err => console.error("Błąd zapisu:", err));
        });
      });
    });
</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
